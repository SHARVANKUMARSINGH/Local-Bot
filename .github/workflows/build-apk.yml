name: Build & Release Local Bots Android APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Architecture APKs & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install Components
        run: |
          SDKMANAGER=$(find ${ANDROID_HOME}/cmdline-tools -name sdkmanager | head -n 1)
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER --install "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;35.0.0" "platforms;android-35"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Run Unit Tests and Assemble Debug APKs
        timeout-minutes: 15
        run: |
          ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon --console=plain

      - name: Identify and Organize Generated APKs
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk/debug/ -type f -name "*.apk" -exec cp {} build-artifacts/ \;
          echo "=== Built APK Artifacts ==="
          ls -la build-artifacts/

      - name: Validate APK Integrity and Badging
        run: |
          BUILD_TOOLS_DIR=$(find ${ANDROID_HOME}/build-tools -name aapt | head -n 1 | xargs dirname)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"
          for apk in build-artifacts/*.apk; do
            echo "--- Validating $apk ---"
            unzip -t "$apk" > /dev/null
            echo "✓ Zip integrity check passed: $apk"
            "$BUILD_TOOLS_DIR/aapt" dump badging "$apk" | grep -E "package:|application-label:|launchable-activity:|native-code:" || true
          done

      - name: Upload arm64-v8a APK (Primary aarch64)
        uses: actions/upload-artifact@v4
        with:
          name: LocalBots-arm64-v8a-debug
          path: build-artifacts/*arm64-v8a*.apk
          if-no-files-found: warn

      - name: Upload armeabi-v7a APK (32-bit ARM)
        uses: actions/upload-artifact@v4
        with:
          name: LocalBots-armeabi-v7a-debug
          path: build-artifacts/*armeabi-v7a*.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK (PC / Emulator / Waydroid)
        uses: actions/upload-artifact@v4
        with:
          name: LocalBots-x86_64-debug
          path: build-artifacts/*x86_64*.apk
          if-no-files-found: warn

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalBots-universal-debug
          path: build-artifacts/*universal*.apk
          if-no-files-found: warn

      - name: Upload All Build APKs Bundle
        uses: actions/upload-artifact@v4
        with:
          name: LocalBots-All-APKs
          path: build-artifacts/*.apk

      - name: Create GitHub Release and Upload APKs
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-b${{ github.run_number }}
          name: "Local Bots v1.0.0 (Build ${{ github.run_number }})"
          body: |
            # Local Bots v1.0.0 Release

            Autonomous AI Computer-Use Agent running natively on Android with an embedded `aarch64` Linux runtime.

            ### Fixes in this build:
            - **Startup Crash Resolution**: Replaced uninitialized lateinit properties in `LocalBotsApp` with infallible lazy delegates and safe fallbacks.
            - **Cryptographic Resilience**: Eliminated Keystore/EncryptedSharedPreferences startup crashes by providing safe fallback preferences if StrongBox or AES-GCM provider fails.
            - **Lazy ViewModel Scoping**: Decoupled ViewModel instantiation in `MainActivity` so background viewmodels don't trigger unhandled coroutines during cold start.
            - **NDK Static STL**: Switched native compilation to `c++_static` to ensure `libnative-lib.so` is completely self-contained without dynamic dependency issues.

            ### Available Download Formats:
            * **`app-arm64-v8a-debug.apk`**: Primary optimized build for 64-bit ARM Android devices.
            * **`app-armeabi-v7a-debug.apk`**: Compatible build for older 32-bit ARM devices.
            * **`app-x86_64-debug.apk`**: Optimized for PC Android Emulators, WSA, and Waydroid.
            * **`app-universal-debug.apk`**: Universal multi-architecture bundle.
          files: |
            build-artifacts/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
